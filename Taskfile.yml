version: '3'

# Nixpkgs 24.05 release tag, provides clang-tools 18.1.6 (clang-format 18).
# https://github.com/NixOS/nixpkgs/tree/24.05
vars:
  NIXPKGS_REV: 5646423bfac84ec68dfc60f2a322e627ef0d6a95
  NIXPKGS_CLANG_TOOLS: clang-tools_18
  NIXPKGS_URI: github:NixOS/nixpkgs/{{.NIXPKGS_REV}}#{{.NIXPKGS_CLANG_TOOLS}}
  # Nixpkgs 24.11 revision (LLVM 19, whose libc++ provides std::atomic_ref) used
  # by the MemorySanitizer build.
  NIXPKGS_SANITIZER_REV: 50ab793786d9de88ee30ec4e4c24fb4236fc2674
  # Enable nix flakes through the native NIX_CONFIG env var (set in the
  # nix-* tasks' env block).
  NIX_CONFIG: 'experimental-features = nix-command flakes'

tasks:
  format:
    cmds:
      - find src/ include/ -name '*.[ch]pp' -exec clang-format -i {} \;
    silent: true

  check-format:
    cmds:
      - find src/ include/ -name '*.[ch]pp' -exec clang-format -fallback-style=none --Werror {} \;

  # Runs clang-format 18 from a pinned nixpkgs
  nix-format:
    desc: Run the format task with clang-format 18 from a pinned nixpkgs
    env:
      NIX_CONFIG: '{{.NIX_CONFIG}}'
    cmds:
      - nix shell '{{.NIXPKGS_URI}}' --command task format

  nix-check-format:
    desc: Run the check-format task with clang-format 18 from a pinned nixpkgs
    env:
      NIX_CONFIG: '{{.NIX_CONFIG}}'
    cmds:
      - nix shell '{{.NIXPKGS_URI}}' --command task check-format

  # Configure, build and run the test suite under a sanitizer inside a pinned nix
  # toolchain. Each task returns non-zero if the configure, the build or any test
  # fails, so they can gate CI.
  nix-sanitizer-address:
    desc: Configure, build and test with AddressSanitizer via nix
    env:
      NIX_CONFIG: '{{.NIX_CONFIG}}'
      NIXPKGS_REV: '{{.NIXPKGS_REV}}'
      NIXPKGS_SANITIZER_REV: '{{.NIXPKGS_SANITIZER_REV}}'
    cmds:
      - bash ./scripts/run-sanitizer.sh address

  nix-sanitizer-undefined:
    desc: Configure, build and test with UndefinedBehaviorSanitizer via nix
    env:
      NIX_CONFIG: '{{.NIX_CONFIG}}'
      NIXPKGS_REV: '{{.NIXPKGS_REV}}'
      NIXPKGS_SANITIZER_REV: '{{.NIXPKGS_SANITIZER_REV}}'
    cmds:
      - bash ./scripts/run-sanitizer.sh undefined

  nix-sanitizer-memory:
    desc: Configure, build and test with MemorySanitizer via nix
    env:
      NIX_CONFIG: '{{.NIX_CONFIG}}'
      NIXPKGS_REV: '{{.NIXPKGS_REV}}'
      NIXPKGS_SANITIZER_REV: '{{.NIXPKGS_SANITIZER_REV}}'
    cmds:
      - bash ./scripts/run-sanitizer.sh memory

  # Convenience aggregate: runs every sanitizer task.
  nix-sanitizers:
    desc: Configure, build and test with every sanitizer via nix
    cmds:
      - task: nix-sanitizer-address
      - task: nix-sanitizer-undefined
      - task: nix-sanitizer-memory

  coverage:
    cmds:
      - ./scripts/coverage.sh